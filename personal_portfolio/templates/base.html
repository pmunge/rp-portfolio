<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}My Personal Portfolio{% endblock title %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <!-- fontawesome link -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        rel="stylesheet"
    >
    <style>
        html, body {
            height: 100%;
        }
        .content {
            flex: 1; 
        }
        footer p {
    color: #FFF;  /* Set the color to white or any other contrasting color */
    font-size: 14px;  /* Adjust font size if needed */
        }
    </style>
</head>
<body class="d-flex flex-column bg-image">
    <div class="content">
        {% block page_content %}{% endblock page_content %}
    </div>
    <footer class="bg-dark text-light mt-auto pt-4 pb-4">
        <div class="container">
            <div class="row">
                <!-- Left Side (Text) -->
                <div class="col-md-6">
                    <p class="text-muted mb-0">© 2024 Prudence Munge. All Rights Reserved.</p>
                </div>
                <!-- Right Side (Social Icons) -->
                <div class="col-md-6 text-center">
                    <ul class="list-unstyled d-flex justify-content-center gap-4 mb-0">
                        <!-- LinkedIn -->
                        <li>
                            <a href="https://www.linkedin.com" class="text-light" target="_blank" aria-label="LinkedIn">
                                <i class="fa-brands fa-linkedin fa-2x"></i>
                            </a>
                        </li>
                        <!-- Twitter -->
                        <li>
                            <a href="https://twitter.com" class="text-light" target="_blank" aria-label="Twitter">
                                <i class="fa-brands fa-twitter fa-2x"></i>
                            </a>
                        </li>
                        <!-- Instagram -->
                        <li>
                            <a href="https://www.instagram.com" class="text-light" target="_blank" aria-label="Instagram">
                                <i class="fa-brands fa-instagram fa-2x"></i>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
